# EVE MultiPreview: build the app on every push and every pull request.
#
# Every action is pinned to a commit; the comment after it is the release that commit is.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the .NET SDK that global.json names
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # A warning fails the build, except NuGet's four "this package has a known vulnerability" warnings
      # (NU1901 to NU1904): an advisory published after a commit must not turn that commit's build red.
      # They still show as warnings. The quotes are needed: PowerShell reads a bare ';' as the end of
      # the command.
      - name: Build the app (a warning fails it)
        run: dotnet build EveMultiPreview.csproj -c Debug -warnaserror "-warnnotaserror:NU1901;NU1902;NU1903;NU1904"


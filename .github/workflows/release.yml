# EVE MultiPreview: a v* tag builds and publishes the exe and the thin sender, and makes a DRAFT release with them.
# A tag with a '-' in it (v3.0.0-beta.1) makes a draft that is marked pre-release.
#
# NOT YET RUN ON GITHUB: the first tag is the real test of this file.
#
# What it does not do:
#   - it does not publish. The release stays a draft until you publish it on GitHub;
#   - it does not write release notes. They are not in the repository: paste them into the draft;
#   - it does not sign the exe. The place for that is marked below.
#
# The files are named as every release so far names them: EVE.MultiPreview.exe and EVE.MultiPreview.pdb, and since the thin
# sender (IDEAS P128) EVE.MultiPreview.Send.exe, which goes beside the exe. The in-app updater looks for the first name
# only: it does not fetch the sender, which stays as it was put (it hands anything it cannot finish to the full exe, and the
# pipe protocol is shared source, so an older sender keeps working until the protocol changes).

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the .NET SDK that global.json names
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # For the record of a release: the SDK that built it.
      - name: Say which .NET SDK builds the release
        run: dotnet --version

      # v3.0.0 for Version 3.0.0, or v3.0.0-<suffix> (v3.0.0-beta.1) for a pre-release of it.
      - name: The tag must be the version in EveMultiPreview.csproj
        shell: pwsh
        run: |
          $version = (Select-Xml -Path EveMultiPreview.csproj -XPath '//Version').Node.InnerText
          $tag = $env:GITHUB_REF_NAME
          if ($tag -ne "v$version" -and -not $tag.StartsWith("v$version-")) {
            throw "The tag is $tag but EveMultiPreview.csproj says version $version. Tag the commit that sets the version (v$version, or v$version-<suffix> for a pre-release)."
          }

      # A warning fails the publish, except NuGet's four "this package has a known vulnerability" warnings
      # (NU1901 to NU1904): an advisory published after the tagged commit must not turn the tag's build red.
      # They still show as warnings. The quotes are needed: PowerShell reads a bare ';' as the end of the command.
      - name: Publish the single-file exe (a warning fails it)
        run: dotnet publish EveMultiPreview.csproj -c Release -o publish -warnaserror "-warnnotaserror:NU1901;NU1902;NU1903;NU1904"

      # IDEAS P128: the thin sender, a small native exe that a Stream Deck / Touch Portal / AutoHotkey key runs instead of the
      # full exe (about a tenth of the time). NativeAOT links with the Visual Studio C++ tools the runner has; vswhere, which
      # that step looks for, lives in the Visual Studio Installer folder, so that folder goes on the PATH for this step.
      - name: Publish the thin sender (a warning fails it)
        shell: pwsh
        run: |
          $env:PATH += ";${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          dotnet publish Sender/EveMultiPreviewSend.csproj -c Release -o publish-sender -warnaserror "-warnnotaserror:NU1901;NU1902;NU1903;NU1904"
          if ($LASTEXITCODE -ne 0) { throw "The thin sender did not publish." }

      - name: Name the files as the releases name them
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item -LiteralPath 'publish/EVE MultiPreview.exe' -Destination 'release/EVE.MultiPreview.exe'
          Copy-Item -LiteralPath 'publish/EVE MultiPreview.pdb' -Destination 'release/EVE.MultiPreview.pdb'
          Copy-Item -LiteralPath 'publish-sender/EVE MultiPreview Send.exe' -Destination 'release/EVE.MultiPreview.Send.exe'
          foreach ($name in 'EVE.MultiPreview.exe', 'EVE.MultiPreview.Send.exe') {
            $hash = (Get-FileHash -LiteralPath "release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$name SHA-256: ``$hash``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      # ── SIGNING GOES HERE (not set up) ──────────────────────────────────────────────────────────────
      # When the project has a code-signing certificate, the exe is signed at this point: after it is built
      # and before it is handed to the release job. Nothing signs it today, so Windows SmartScreen warns
      # about every download.
      # ────────────────────────────────────────────────────────────────────────────────────────────────

      - name: Hand the files to the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error
          retention-days: 7

  # The only job that may write to the repository, and it runs none of the repository's code:
  # it takes the files the build job made and attaches them to a new draft release.
  draft-release:
    name: Draft the release
    needs: [build]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Take the files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      # A tag with a '-' in it is a pre-release.
      - name: Make the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @()
          if ($env:GITHUB_REF_NAME.Contains('-')) { $flags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME `
            release/EVE.MultiPreview.exe release/EVE.MultiPreview.pdb release/EVE.MultiPreview.Send.exe `
            --repo $env:GITHUB_REPOSITORY --draft --verify-tag `
            --title $env:GITHUB_REF_NAME `
            --notes "Paste the release notes here before you publish." `
            @flags
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed." }
